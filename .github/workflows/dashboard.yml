name: Render Kindle dashboard

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    paths: ["verse.json", "config.json", "render.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python render.py --out dashboard.png
      - name: Commit the new image
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add dashboard.png
          [ -f verse_cache.json ] && git add verse_cache.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Update dashboard"
            git push
          fi
